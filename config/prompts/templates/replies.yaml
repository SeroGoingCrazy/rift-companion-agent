# Reply templates by reply_type (Jinja2). Always available: summary (one line of the
# collected slots), booking (BookingState as JSON), domain; plus the turn's facts.
# Filters: mode rank role service gender field dt money hours.

help: |
  你好，我是峡谷陪练的预约助手～可以帮你：
  · 约陪玩：比如「帮我约个明晚八点的单双排，钻石以上」
  · 问规则：比如「开局前三小时取消退多少？」
  · 管订单：比如「我有哪些订单」「取消明天那单」

extraction_failed: |
  抱歉，我没太理解这句话，能换个说法再说一次吗？
  {% if summary %}（目前已记下：{{ summary }}）{% endif %}

error: |
  抱歉，刚才处理出了点问题，能再说一遍吗？之前的信息我都还记着。

service_unavailable: |
  预约服务暂时连不上，请稍后再试一次～已记下的信息不会丢：{{ summary }}

ask_missing: |
  {% if summary %}好的，已记下：{{ summary }}。
  {% endif %}
  {% if cleared %}（{% for f in cleared %}{{ f | field }}{% if not loop.last %}、{% endif %}{% endfor %}对{{ booking.game_mode | mode }}不适用，已忽略）
  {% endif %}
  {% if invalid %}{% for f, reason in invalid.items() %}{{ reason }}。{% endfor %}
  {% endif %}
  {% if field == "game_mode" %}想约哪种模式呢？单双排、灵活组排、匹配、大乱斗、海克斯大乱斗、斗魂竞技场都可以。
  {% elif field == "start_time" %}想约什么时候开始？比如「明晚八点」「周六下午三点」。
  {% elif field == "duration_hours" %}打几个小时呢？（1–8 小时，可以按半小时算）
  {% elif field == "rank_requirement" %}对陪玩师段位有要求吗？比如「钻石以上」，没要求也可以说「无所谓」。
  {% else %}还需要确认一下{{ field | field }}。
  {% endif %}

ask_time: |
  {% if reason == "past" %}「{{ expr }}」这个时间已经过了，换个时间吧？
  {% elif reason in ("vague", "ambiguous_hour", "ambiguous_ampm") %}「{{ expr }}」具体是几点开始呢？比如「晚上八点」。
  {% elif reason == "ambiguous_date" %}「{{ expr }}」里好像有两个日期，是哪一天呢？
  {% else %}没太听懂「{{ expr }}」是什么时候，可以说「明晚八点」「周六下午三点」这样的时间。
  {% endif %}

candidates: |
  {% if declined %}好的，不约这位了。
  {% endif %}
  {% if quote_error %}这位陪玩师暂时约不了（{{ quote_error }}），换一位吧。
  {% endif %}
  {% if conflict %}刚才那个时段被别人抢先约走了，帮你重新找了一下：
  {% endif %}
  {% if companion_unavailable %}{{ companion_unavailable }} 在新的条件下约不到了，看看这些：
  {% endif %}
  {% if relaxation_notes %}按原条件没找到合适的陪玩师，已帮你{{ relaxation_notes | join("，") }}：
  {% else %}按「{{ summary }}」为你找到这些陪玩师：
  {% endif %}
  {% for c in cards %}
  {{ loop.index }}. {{ c.name }}｜{{ c.rank | rank }}｜{% for r in c.roles %}{{ r | role }}{% if not loop.last %}/{% endif %}{% endfor %}｜{{ c.effective_hourly_price | money }} 元/小时{% if c.start_time != booking.start_time %}｜可约 {{ c.start_time | dt }}{% endif %}

     {{ c.reasons | join("，") }}
  {% endfor %}
  想约哪位？说「第一个」或直接说名字就行。

no_candidates: |
  抱歉，按「{{ summary }}」没找到能约的陪玩师{% if tried %}（已尝试放宽时间、性别、位置）{% endif %}。
  {% if has_budget %}预算和段位要求不会自动放宽，可以提高一点预算，或者换个时间试试？
  {% else %}换个时间或调整一下要求试试？
  {% endif %}

confirm_booking: |
  请确认订单：
  · 陪玩师：{{ companion }}{% if rank %}（{{ rank | rank }}）{% endif %}

  · 模式：{{ mode | mode }}｜{{ service | service }}
  · 时间：{{ start_time | dt }} 起，{{ hours | hours }} 小时{% if time_adjusted %}（已按陪玩师可约时间调整）{% endif %}

  · 价格：{{ unit_price | money }} × {{ multiplier }} × {{ hours | hours }} = {{ total | money }} 元
  确认下单吗？（回复「确认」下单，或「算了」换一位）

reconfirm: |
  还在等你确认这一单：{{ companion }}｜{{ mode | mode }}｜{{ start_time | dt }} 起 {{ hours | hours }} 小时，共 {{ total | money }} 元。
  确认下单吗？（回复「确认」或「算了」）

booked: |
  下单成功！订单号 #{{ order.booking_id }}
  · {{ order.companion_name }}｜{{ order.game_mode | mode }}｜{{ order.start_time | dt }} 起 {{ order.hours | hours }} 小时
  · 应付 {{ order.total | money }} 元（待支付，可在「我的订单」里完成支付）
  ⏰ 开局提醒：请在 {{ order.start_time | dt }} 前 10 分钟上线，{{ order.companion_name }} 会在游戏里加你好友。

booking_failed: |
  下单没有成功：{{ message }}。要换一位或者换个时间吗？

consult: |
  {% if unavailable %}规则查询服务暂时连不上，稍后再问我一次吧。
  {% elif no_answer %}这个问题我暂时没有查到相关规则，可以换个问法试试。
  {% else %}{{ answer }}
  {% if sources %}（参考：{{ sources | join("、") }}）{% endif %}

  {% endif %}
  {% if resume %}
  {% if resume.confirm %}回到刚才的订单：确认下单吗？（回复「确认」或「算了」）
  {% elif resume.field %}回到预约：{% if resume.field == "game_mode" %}想约哪种模式？{% elif resume.field == "start_time" %}想约什么时候开始？{% elif resume.field == "duration_hours" %}打几个小时呢？{% elif resume.field == "rank_requirement" %}对段位有要求吗？{% else %}还需要确认{{ resume.field | field }}。{% endif %}

  {% elif resume.candidates %}回到预约：上面几位陪玩师想约哪位？
  {% endif %}
  {% endif %}

unrelated: |
  这个我帮不上忙哈，我只负责峡谷陪练的陪玩预约和规则咨询～
  {% if resume.confirm %}刚才的订单还等你确认：确认下单吗？
  {% elif resume.field %}我们继续预约吧：还需要{{ resume.field | field }}。
  {% elif resume.candidates %}上面几位陪玩师想约哪位？
  {% endif %}

abandon: |
  好的，这次先不约了{% if dropped %}（已取消：{{ dropped }}）{% endif %}。想约的时候随时叫我～

manage_list: |
  {% if bookings %}你的订单：
  {% for b in bookings %}
  {{ loop.index }}. #{{ b.booking_id }} {{ b.companion_name }}｜{{ b.game_mode | mode }}｜{{ b.start_time | dt }} 起 {{ b.hours | hours }} 小时｜{{ b.total | money }} 元｜{{ b.status | status }}
  {% endfor %}
  {% if active %}需要取消的话，说「取消第一个」就行；支付请到「我的订单」页面。{% endif %}
  {% else %}你还没有订单哦，要现在约一个吗？
  {% endif %}

manage_which: |
  你有 {{ bookings | length }} 个进行中的订单，要取消哪一个？
  {% for b in bookings %}
  {{ loop.index }}. #{{ b.booking_id }} {{ b.companion_name }}｜{{ b.game_mode | mode }}｜{{ b.start_time | dt }}｜{{ b.status | status }}
  {% endfor %}

manage_empty: |
  你目前没有可以取消的订单。

manage_error: |
  操作没有成功：{{ message }}。

cancel_confirm: |
  确认取消订单 #{{ order.booking_id }}（{{ order.companion_name }}｜{{ order.game_mode | mode }}｜{{ order.start_time | dt }}）吗？
  {% if paid %}距开局还有 {{ hours_before | left }}，按规则{{ refund_label }}，可退 {{ refund_amount | money }} 元。
  {% else %}这单还没支付，取消不产生任何费用。
  {% endif %}
  回复「确认」取消，或「算了」保留订单。

cancel_unclear: |
  没太听明白～确认取消订单 #{{ order.booking_id }} 吗？回复「确认」或「算了」。

cancelled: |
  已取消订单 #{{ order.booking_id }}。{% if paid and refund_amount | float > 0 %}退款 {{ refund_amount | money }} 元将原路退回（{{ refund_label }}）。{% elif paid %}按规则{{ refund_label }}。{% else %}订单未支付，无需退款。{% endif %}

cancel_aborted: |
  好的，订单 #{{ order.booking_id }} 保留，不取消了。
