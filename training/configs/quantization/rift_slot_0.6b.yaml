# Quantization and CPU benchmark of the final slot model (DEV_SPEC I10).
#   uv run python training/scripts/quantize/quantize.py
#   uv run --env-file .env python training/scripts/quantize/bench.py
model: rift-slot-0.6b
# I9 winner: SFT r003 0.6B + rule-perturbation DPO, beta 0.3 (training/experiments/dpo/ablation.md).
source: training/outputs/gguf/rift-slot-0.6b-dpo_rule_b03-f16.gguf
out_dir: training/outputs/gguf
# Name -> llama-quantize type, or {type, imatrix: true}. f16 is the source and is never
# re-quantized.
variants:
  f16: F16
  q8_0: Q8_0
  q4_k_m: Q4_K_M
  q4_k_m_imat: {type: Q4_K_M, imatrix: true}
# Importance matrix for the imatrix variants. Calibration text is rendered from the SFT train
# split only (seeded sample, chat template with thinking off); the L2 eval sets never touch it.
imatrix:
  file: training/outputs/gguf/rift-slot-0.6b-imatrix.gguf
  dataset: training/data/processed/sft/v0.4/train.jsonl
  calibration: training/outputs/gguf/rift-slot-0.6b-calibration.txt
  samples: 256
  ctx: 2048
  seed: 42

llama_cpp:
  repo_wsl: /mnt/c/Users/1/rift-companion-agent
  quantize: ~/rift-train/llama.cpp/build/bin/llama-quantize
  imatrix: ~/rift-train/llama.cpp/build/bin/llama-imatrix
  server: ~/rift-train/llama.cpp/build/bin/llama-server
  logs: ~/rift-train/logs

server:
  port: 8080
  ctx: 4096
  parallel: 1
  threads: 6             # physical cores of the Ryzen 5 9600X
  # Thinking off, exactly like training (template qwen3 + enable_thinking=false).
  chat_template_kwargs: {enable_thinking: false}

bench:
  datasets: [main, holdout]
  # Requests with cache_prompt=false, to show what the warm shared prefix saves.
  nocache_samples: 10
  timeout_s: 60

# Q4_K_M may fail at most 2 more L2 samples (main + holdout) than F16.
gate:
  baseline: f16
  candidate: q4_k_m_imat   # plain q4_k_m failed the gate (+4); see training/experiments/quant/report.md
  max_extra_failures: 2
