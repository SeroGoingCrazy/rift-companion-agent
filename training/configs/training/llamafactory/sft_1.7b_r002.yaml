# SFT r002 (v0.3 = v0.2 + contrast set r002), Qwen3-1.7B (DEV_SPEC I5 / 3.7). Run from the repo root in the training env:
#   llamafactory-cli train training/configs/training/llamafactory/sft_1.7b_r002.yaml
# Template: qwen3 + enable_thinking=false renders exactly like the official chat template
# with enable_thinking=False (checked by training/scripts/train/check_template.py), so the
# online llama-server must also be called with enable_thinking=false.

### model
model_name_or_path: Qwen/Qwen3-1.7B
trust_remote_code: true

### method (LoRA r16 / alpha 32 on all linear layers)
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset_dir: training/data/processed/sft/v0.3
dataset: rift_sft_v0_3_train
eval_dataset: rift_sft_v0_3_val
template: qwen3
enable_thinking: false
cutoff_len: 2048          # longest sample is 1345 tokens
mask_history: true
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: training/outputs/sft_1.7b_r002
logging_steps: 5
save_strategy: epoch
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: none

### train (effective batch 16)
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
seed: 42

### eval
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 10
