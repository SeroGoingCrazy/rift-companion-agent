# Contrast set r002 (DEV_SPEC I7): targeted add-on to SFT v0.2, built from the r001 L2 errors
# (training/experiments/r001/conclusion.md). Each variant aims at one error type; examples in
# the hints are deliberately different from the L2 eval wordings (no leakage).
#
#   compact_dense      time + duration written back to back, 4-7 slots in one terse sentence
#   after_vs_duration  "X 小时后" is a start time, "打 X 小时" a duration -- the contrast case
#   withdraw_mode      game_mode: null (v0.1/v0.2 never withdrew the mode)
#   any_x_not_x        "X不X都无所谓" / "A还是B都行" -> "any" on optional slots
#   ordinal_forms      "2号" / "最后那个" / "倒数第二个" -> the exact candidate name
#   ordinal_and_change pick by position and change another slot in the same sentence
#   near_platform / errand  consult vs. unrelated

version: v0.3c
kind: contrast
total: 200
seed: 20261002
now:
  start: 2026-10-01
  days: 21            # conversations happen over three weeks (all weekdays covered)
  hours: [9, 23]      # inclusive; minutes are 00 / 15 / 30 / 45

# Surface styles of the user's wording (说法风格). Variants and categories may override weights.
styles:
  standard:
    weight: 0.30
    hint: 规范书面的中文，完整句子。
  colloquial:
    weight: 0.30
    hint: 口语化，带语气词、省略主语、倒装或碎句，如"整个双排呗""那就俩小时吧"。
  slang:
    weight: 0.15
    hint: 玩家黑话和简称，如"双排""上分""带飞""软辅""野王""峡谷"。
  typo:
    weight: 0.10
    hint: 含一两处常见错别字或同音字（如"晚尚""砖石""辅主"），但意思仍明确，不影响槽位判断。
  mixed_en:
    weight: 0.15
    hint: 中英混杂或拼音缩写，如"打 jg""辅助位""ad""duo 一下""rank""xjj"。

# How often each game mode is the conversation's mode (also restricts which slots apply:
# rank only for ranked modes, no rank / role in ARAM-like modes, per config/domain.yaml).
modes:
  ranked_solo_duo: 0.30
  ranked_flex: 0.12
  normal_draft: 0.18
  aram: 0.18
  aram_mayhem: 0.10
  arena: 0.12

# Weights for randomly picked slots. 0 = never picked at random (only via `require` or an
# explicit `pool`).
field_weights:
  game_mode: 3.0
  start_time_expr: 3.0
  duration_hours: 2.5
  rank_requirement: 1.5
  role_preference: 1.2
  service_type: 0.8
  companion_gender: 1.2
  voice_required: 0.8
  budget_per_hour: 0.8
  style_preference: 1.0
  companion_name: 0

categories:
  first_turn:
    quota: 0.40
    history_turns: [0, 0]
    styles: {standard: 0.05, colloquial: 0.5, slang: 0.3, typo: 0.1, mixed_en: 0.05}
    variants:
      compact_dense:
        weight: 0.75
        hint: 用户一句话给出 4–7 项信息，写得很紧凑：少用或不用标点，时间和时长紧挨着写（如"后天下午三点三小时""今晚九点半一个半小时"），模式、段位、位置、性别、服务类型用最短的说法连着写。时间和时长要分别抽出来。
        require: [start_time_expr, duration_hours]
        value: {count: [2, 5]}
        time_forms: {relative_day: 0.6, weekday: 0.25, digits: 0.15}
      after_vs_duration:
        weight: 0.25
        hint: 开始时间用"X小时后/半小时后"这种从现在算起的说法，同时另外说要打多久（如"一个半小时后开，打两小时"）。"X小时后"是开始时间，"打X小时"才是时长，不要混淆。
        require: [start_time_expr, duration_hours]
        value: {count: [0, 2]}
        time_forms: {after: 1.0}

  tri_state:
    quota: 0.30
    history_turns: [1, 3]
    variants:
      withdraw_mode:
        weight: 0.42
        hint: 用户撤回之前定好的模式、暂时不定（"模式先不定""打排位还是匹配回头再说""玩啥模式我再想想"），game_mode 为 null；不要输出 "any"。
        require_state: [game_mode]
        state: {count: [1, 3]}
        withdraw: {count: [1, 1], pool: [game_mode]}
        value: {count: [0, 1]}
      any_x_not_x:
        weight: 0.58
        hint: 用"X不X都无所谓""A还是B都行""要不要都可以""多少都行""谁都可以"这类句式表示不限，值为 "any"，不是 null 也不是省略。
        state: {count: [1, 3]}
        any:
          count: [1, 2]
          pool: [voice_required, companion_gender, style_preference, budget_per_hour, companion_name]
        value: {count: [0, 1]}

  candidate_ref:
    quota: 0.225
    history_turns: [1, 2]
    styles: {standard: 0.1, colloquial: 0.5, slang: 0.2, typo: 0.1, mixed_en: 0.1}
    variants:
      ordinal_forms:
        weight: 0.67
        hint: 用不同的序号说法挑候选，写得很短："2号""第一位""最后那个""倒数第二个""最上面那个""中间那个""选3"。companion_name 输出 candidates 中对应位置的确切名字，不要照抄序号说法。
        candidates: [2, 4]
        state: {count: [2, 4]}
        require_state: [game_mode]
        require: [companion_name]
      ordinal_and_change:
        weight: 0.33
        hint: 用序号选人，同一句话里紧接着改另一项（如"选2号，改到后天晚上""最后那个吧时长加到三小时"），两件事都要抽出来。
        candidates: [2, 4]
        state: {count: [2, 4]}
        require_state: [game_mode]
        require: [companion_name]
        modify: {count: [1, 1]}

  consult:
    quota: 0.05
    history_turns: [1, 2]
    variants:
      near_platform:
        weight: 1.0
        hint: 预约中插话问和陪玩服务有关、但不属于预约字段的问题（"陪玩师中途掉线怎么算""能开发票吗""可以指定英雄吗""中途想换人可以吗"），turn_intent=consult，delta 为空。
        turn_intent: consult
        state: {count: [1, 3]}

  unrelated:
    quota: 0.025
    history_turns: [0, 1]
    variants:
      errand:
        weight: 1.0
        hint: 让助手做与陪玩平台无关的事（"帮我点个外卖""推荐部电影""查下明天天气"），turn_intent=unrelated，delta 为空——不要因为话里有时间就当成咨询或预约。
        turn_intent: unrelated

# Target-value distributions (rift_training.data.targets).
values:
  rank_requirement: {iron: 0.6, bronze: 0.8, silver: 1.0, gold: 1.2, platinum: 1.2, emerald: 1.0, diamond: 1.2, master: 0.8, grandmaster: 0.5, challenger: 0.4}
  duration_hours: {1: 1.5, 1.5: 1.0, 2: 2.0, 2.5: 1.0, 3: 1.5, 3.5: 0.5, 4: 1.0, 4.5: 0.2, 5: 0.5, 6: 0.3, 7: 0.1, 8: 0.2}
  roles: {top: 1, jungle: 1, mid: 1, adc: 1, support: 1}
  role_count: {1: 0.65, 2: 0.3, 3: 0.05}
  service_type: {climb: 1.0, casual: 1.0, coaching: 0.8}
  companion_gender: {female: 0.6, male: 0.4}
  voice_required: {true: 0.7, false: 0.3}
  budget_per_hour: {30: 0.6, 40: 0.8, 50: 1.0, 60: 1.0, 70: 0.8, 80: 1.0, 100: 0.8, 120: 0.6, 150: 0.4, 200: 0.3}
  style_themes: [温柔耐心, 幽默搞笑, 安静少话, 技术流会指挥, 会讲解思路, 活泼话多, 脾气好不骂人, 高冷大神范, 情绪稳定, 会夸人, 二次元, 节奏快, 佛系, 爱聊天, 细心会复盘, 有梗]
  time:
    forms: {relative_day: 0.45, weekday: 0.2, next_week: 0.1, digits: 0.15, after: 0.1}
    hours: {10: 0.3, 12: 0.3, 13: 0.5, 14: 0.7, 15: 0.7, 16: 0.6, 17: 0.6, 18: 0.8, 19: 1.2, 20: 1.5, 21: 1.5, 22: 1.2, 23: 0.6}
    minutes: {0: 0.55, 30: 0.35, 15: 0.05, 45: 0.05}
    day_offsets: {0: 0.35, 1: 0.45, 2: 0.15, 3: 0.05}
    after_hours: {0.5: 1.0, 1: 1.0, 1.5: 0.6, 2: 0.8, 3: 0.4}
    shift_hours: {-1: 0.6, -0.5: 0.8, 0.5: 0.8, 1: 1.0, 1.5: 0.5, 2: 0.6}
    modify_shift: 0.5
