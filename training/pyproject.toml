[project]
name = "rift-training"
version = "0.1.0"
description = "Post-training pipeline for the local slot extractor."
requires-python = ">=3.12"
dependencies = [
    "rift-agent",
    "rift-common",
    "rift-domain",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
rift-agent = { workspace = true }
rift-common = { workspace = true }
rift-domain = { workspace = true }
