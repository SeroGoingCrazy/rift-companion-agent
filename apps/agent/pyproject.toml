[project]
name = "rift-agent"
version = "0.1.0"
description = "LangGraph orchestration for the Rift Companion booking agent."
requires-python = ">=3.12"
dependencies = [
    "rift-common",
    "rift-domain",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
rift-common = { workspace = true }
rift-domain = { workspace = true }
