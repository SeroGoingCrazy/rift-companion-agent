[project]
name = "rift-companion-agent"
version = "0.1.0"
description = "Rift Companion Agent: conversational booking agent for a fictional LoL companion platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rift-common[langfuse]",
    "rift-domain",
    "booking-mcp",
    "rift-agent",
    "rift-web",
    "rift-training",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/common",
    "packages/domain",
    "services/booking_mcp",
    "apps/agent",
    "apps/web",
    "training",
]

[tool.uv.sources]
rift-common = { workspace = true }
rift-domain = { workspace = true }
booking-mcp = { workspace = true }
rift-agent = { workspace = true }
rift-web = { workspace = true }
rift-training = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: L1 offline component tests (CI)",
    "integration: in-process SQLite / MCP / graph tests with mock LLM (CI)",
    "e2e: real services and real LLM (manual / pre-release)",
    "llm: requires a real LLM API key",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services/knowledge_mcp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow full-width CJK punctuation in strings/comments

[tool.ruff.lint.isort]
known-first-party = ["rift_common", "rift_domain", "booking_mcp", "rift_agent", "rift_web", "rift_training"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/common/src", "packages/domain/src"]
explicit_package_bases = true
