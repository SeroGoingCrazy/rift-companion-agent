# Modular RAG MCP Server - Configuration
# This is the main configuration file for the MCP Server.
# Edit this file to configure LLM, Embedding, VectorStore, and other services.
# Secrets are never written here: use ${ENV_VAR} (or ${ENV_VAR:-default}) references.

# =============================================================================
# LLM Configuration
# =============================================================================
# DeepSeek (OpenAI-compatible) is the remote LLM for the whole project; only
# LLM-backed options below (chunk refiner / metadata enricher / llm rerank) use it.
llm:
  provider: "deepseek"  # Options: openai, azure, ollama, deepseek
  model: "deepseek-chat"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: "${DEEPSEEK_API_KEY:-}"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
# Local sentence-transformers model (DeepSeek has no embedding API). Needs the
# local-embedding extra: `uv sync --extra local-embedding`. Changing the model
# changes the vector size: re-ingest with `scripts/ingest_kb.py --force`.
embedding:
  provider: "local"  # Options: local, openai, azure, ollama
  model: "BAAI/bge-small-zh-v1.5"
  dimensions: 512  # bge-small-zh-v1.5 output size (checked after each embed call)
  # Azure-compatible settings (azure_endpoint triggers Azure compat mode):
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: false  # Set to true to enable vision capabilities
  provider: "openai"  # Options: openai, azure, ollama
  model: "gpt-4o"  # Options: gpt-4o, gpt-4-vision-preview (OpenAI), llava (Ollama)
  # Azure-compatible settings (azure_endpoint triggers Azure compat mode):
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: "${OPENAI_API_KEY:-}"
  # Ollama-specific settings (if provider is ollama):
  # base_url: "http://localhost:11434"
  max_image_size: 2048  # Max dimension (width/height) for image compression

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "platform_rules"  # default collection; KB collections: platform_rules, modes_and_ranks, companion_profiles

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: false
  provider: "none"  # Options: none, cross_encoder, llm
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100
  
  # Chunk Refiner Configuration (C5)
  # Both LLM passes stay off: KB docs are generated from domain.yaml, and an LLM
  # rewrite could change the numbers in them. Rule-based fallbacks still run.
  chunk_refiner:
    use_llm: false  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: false  # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment
