[project]
name = "booking-mcp"
version = "0.1.0"
description = "Booking MCP server: companions, schedules and orders."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9,<2",
    "rift-common",
    "rift-domain",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
rift-common = { workspace = true }
rift-domain = { workspace = true }
