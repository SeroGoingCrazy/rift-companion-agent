name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint / typecheck / offline tests
    runs-on: ubuntu-latest
    # Offline only: no secrets are injected; all LLM calls go through the mock provider.
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (packages)
        run: uv run mypy packages

      - name: Pytest (unit + integration)
        run: uv run pytest -m "unit or integration"
