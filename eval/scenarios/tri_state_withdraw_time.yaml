id: tri_state_withdraw_time
description: 三态：撤回时间（null）后重新给时间
now: "2026-10-01 14:00"
user: { nickname: tester_01 }
turns:
  - say: "帮我约个明晚八点的大乱斗，两个小时"
    expect_reply_type: candidates
  - say: "时间先不定，我再看看"
    expect_reply_type: ask_missing
    expect_slots: { start_time: null }
  - say: "后天晚上九点吧"
    expect_reply_type: candidates
    expect_slots: { start_time: "2026-10-03 21:00" }
  - say: "第一个"
    expect_reply_type: confirm_booking
  - say: "确认"
    expect_reply_type: booked
expect:
  booking: { status: pending_payment, game_mode: aram, start_time: "2026-10-03 21:00", duration_hours: 2 }
